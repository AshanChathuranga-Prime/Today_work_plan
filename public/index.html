<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Private daily work updates for PrimeOne employees.">
    <title>Today Work Plan</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">PRIMEONE · DAILY UPDATE</p>
        <h1>Today Work Plan</h1>
        <p class="lede">Share a clear daily update with your company. Updates are delivered by email and are not stored in this application.</p>
      </header>
      <section class="card" aria-labelledby="update-heading">
        <h2 id="update-heading">Your work update</h2>
        <p class="required-note"><span aria-hidden="true">*</span> Required fields</p>
        <form id="update-form" novalidate>
          <div class="grid two">
            <label>Name *<input name="employeeName" autocomplete="name" maxlength="80" required></label>
            <label>Employee ID *<input name="employeeId" maxlength="40" required></label>
          </div>
          <label>Work date *<input name="workDate" type="date" required></label>
          <label>What did you work on today? *<textarea name="summary" maxlength="800" required></textarea></label>
          <label>Key accomplishments<textarea name="accomplishments" maxlength="1600"></textarea></label>
          <label>Blockers or support needed<textarea name="blockers" maxlength="1000"></textarea></label>
          <label>Plan for tomorrow<textarea name="nextSteps" maxlength="1200"></textarea></label>
          <label>Employee access code *<input name="accessCode" type="password" autocomplete="off" required aria-describedby="code-help"></label>
          <p id="code-help" class="help">Your access code is verified securely and is never saved by this app.</p>
          <button type="submit">Send daily update</button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
